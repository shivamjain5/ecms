server:
  port: 8080

spring:
  application:
    name: vms-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/vms_master_db?currentSchema=test2co
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

jwt:
  secret: ${JWT_SECRET:change_this_to_a_long_random_secret_min_32_chars}
  expiration-ms: 86400000

vms:
  storage:
    incoming-dir: /var/vms/incoming   # local temp dir before background upload
  upload-worker:
    fixed-delay-ms: 15000
    max-retries: 5
